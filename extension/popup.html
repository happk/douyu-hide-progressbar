<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; font: 13px/1.5 "Microsoft JhengHei", "PingFang TC", sans-serif; color: #222; }
  h1 { font-size: 14px; margin: 0; padding: 10px 12px 8px; border-bottom: 1px solid #eee; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .row label { flex: 1; cursor: pointer; }
  .slider-row { display: block; padding: 2px 12px 8px; }
  .slider-row .head { margin-bottom: 2px; }
  .slider-row b { color: #e8663c; }
  input[type="range"] { width: 100%; accent-color: #e8663c; }
  #status { margin: 2px 12px 10px; padding: 8px; background: #f6f6f6; border-radius: 6px; white-space: pre-line; font-size: 12px; color: #555; }
  .hint { padding: 0 12px 10px; font-size: 11px; color: #999; }
</style>
</head>
<body>
  <h1>斗魚全屏優化</h1>
  <div class="row">
    <input type="checkbox" id="opt-bar">
    <label for="opt-bar">全屏時隱藏控制列與進度條（重播頁）</label>
  </div>
  <div class="row">
    <input type="checkbox" id="opt-wm">
    <label for="opt-wm">隱藏「斗魚」水印（重播頁與直播間）</label>
  </div>
  <div class="slider-row">
    <div class="head">滑鼠離底部 <b id="zone-val">120</b> px 內顯示控制列</div>
    <input type="range" id="opt-zone" min="60" max="240" step="10" value="120">
  </div>
  <div id="status">讀取中…</div>
  <div class="hint">改動即時生效。控制列功能只在重播頁作用；水印在重播頁與直播間都作用。狀態區要在斗魚分頁開啟才有資訊。</div>
  <script src="popup.js"></script>
</body>
</html>
